# CI do plugin. Roda em ubuntu-latest: manifestos válidos, modelo no esquema e testes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Manifestos válidos
        run: |
          node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','hooks/hooks.json','leis/modelo.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          node -e "const p=require('./.claude-plugin/plugin.json'); if(!/^[a-z0-9-]+$/.test(p.name)) process.exit(1)"

      - name: Modelo no esquema
        run: |
          node --input-type=module -e "import {validarEsquema} from './scripts/leis.mjs'; import fs from 'node:fs'; const e=validarEsquema(JSON.parse(fs.readFileSync('leis/modelo.json','utf8'))); console.log(e); process.exit(e.length?1:0)"

      - name: Testes
        run: node --test "testes/*.test.mjs"
